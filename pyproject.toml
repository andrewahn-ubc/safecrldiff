[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-diffusion-cl-pilots"
version = "0.1.2"
description = "Automated OopsieBench safety-forgetting pilots for RL-fine-tuned action diffusion policies"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "h5py==3.11.0",
  "gymnasium==0.29.1",
  "huggingface-hub==0.24.7",
  "imageio[ffmpeg]==2.35.1",
  "matplotlib==3.9.2",
  "numpy==1.26.4",
  "pandas==2.2.3",
  "pyarrow==17.0.0",
  "PyYAML==6.0.2",
  "scikit-learn==1.5.2",
  "torch==2.3.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "ruff==0.6.9"]

[project.scripts]
safe-pilots-download = "safe_diffusion_cl_pilots.data.download:main"
safe-pilots-minus1 = "safe_diffusion_cl_pilots.pilots.pilot_minus1:main"
safe-pilots-pilot0 = "safe_diffusion_cl_pilots.pilots.pilot0:main"
safe-pilots-pilot1 = "safe_diffusion_cl_pilots.pilots.pilot1:main"
safe-pilots-pilot2 = "safe_diffusion_cl_pilots.pilots.pilot2:main"
safe-pilots-aggregate = "safe_diffusion_cl_pilots.pilots.aggregate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]
